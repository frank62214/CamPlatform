name: Test, publish, and deploy CamPlatform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camplatform-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_NAMESPACE: hackdog30678

jobs:
  validate:
    name: Backend tests and frontend type-check/build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test authentication, recording access, and media authorization
        run: npm test
      - name: Type-check and build frontend
        run: npm run build

  build-images:
    name: Build ${{ matrix.component }} image
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [server, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Verify container build (also runs on pull requests)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.${{ matrix.component }}
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  publish-images:
    name: Publish ${{ matrix.component }} SHA image
    needs: build-images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [server, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish immutable commit tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.${{ matrix.component }}
          push: true
          tags: ${{ env.DOCKERHUB_NAMESPACE }}/camplatform-${{ matrix.component }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  update-deployment:
    name: Update both production images atomically
    needs: publish-images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Reject deployment from an outdated rerun
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCommit({
              ...context.repo, ref: 'main',
            });
            core.setOutput('current', data.sha === context.sha ? 'true' : 'false');
            if (data.sha !== context.sha) core.notice('A newer main commit exists; skipping deployment.');
      - name: Checkout Deployment repository
        if: steps.source.outputs.current == 'true'
        uses: actions/checkout@v4
        with:
          repository: hackdog33456/Deployment
          ref: main
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
      - name: Update and push matching frontend/backend tags
        if: steps.source.outputs.current == 'true'
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            # The checkout is disposable. Reapply only our two edits to the latest
            # Deployment main on every retry, preserving concurrent app updates.
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ['IMAGE_TAG']
          if not re.fullmatch(r'[0-9a-f]{40}', tag):
              raise RuntimeError('Expected the full source commit SHA')
          paths = [Path(f'CamPlatform/environments/prod/{name}-values.yml')
                   for name in ('frontend', 'backend')]
          # Validate both inputs before changing either file. Bootstrap the new
          # backend chart/values in Deployment before the first release workflow.
          changes = []
          for path in paths:
              lines = path.read_text(encoding='utf-8').splitlines()
              in_image = False
              found = False
              for index, line in enumerate(lines):
                  if line == 'image:':
                      in_image = True
                      continue
                  if in_image and line and not line.startswith(' '):
                      break
                  if in_image and line.startswith('  tag:'):
                      lines[index] = f'  tag: "{tag}"'
                      found = True
                      break
              if not found:
                  raise RuntimeError(f'image.tag was not found in {path}')
              changes.append((path, '\n'.join(lines) + '\n'))
          for path, content in changes:
              path.write_text(content, encoding='utf-8')
          PY
            git add CamPlatform/environments/prod/frontend-values.yml CamPlatform/environments/prod/backend-values.yml
            if git diff --cached --quiet; then
              echo "Both production image tags are already current"
              exit 0
            fi
            git commit -m "chore(prod): deploy CamPlatform frontend and backend ${IMAGE_TAG}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Deployment main changed; reapplying both tags (${attempt}/5)"
            sleep $((attempt * 2))
          done
          echo "Unable to push Deployment update after 5 attempts"
          exit 1

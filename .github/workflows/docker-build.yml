name: Build and Push to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: camplatform-prod
  cancel-in-progress: true

env:
  DOCKERHUB_NAMESPACE: hackdog30678

jobs:
  build-server:
    name: Build Server Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Server
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/camplatform-server
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.server
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/camplatform-frontend
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-deployment:
    name: Update Deployment Image Tag
    needs: build-frontend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Deployment repository
        uses: actions/checkout@v4
        with:
          repository: hackdog33456/Deployment
          ref: main
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}

      - name: Update frontend image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          values_path = Path("CamPlatform/environments/prod/frontend-values.yml")
          lines = values_path.read_text(encoding="utf-8").splitlines()
          in_image = False
          updated = False

          for index, line in enumerate(lines):
              if line == "image:":
                  in_image = True
                  continue
              if in_image and not line.startswith("  "):
                  break
              if in_image and line.startswith("  tag:"):
                  lines[index] = f"  tag: {os.environ['IMAGE_TAG']}"
                  updated = True
                  break

          if not updated:
              raise RuntimeError("image.tag was not found in frontend values")

          values_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CamPlatform/environments/prod/frontend-values.yml

          if git diff --cached --quiet; then
            echo "Image tag is already current"
            exit 0
          fi

          git commit -m "chore(prod): update CamPlatform frontend image to ${IMAGE_TAG}"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Deployment push raced with another update; retrying (${attempt}/3)"
            sleep 2
          done

          echo "Unable to push Deployment update after 3 attempts"
          exit 1
